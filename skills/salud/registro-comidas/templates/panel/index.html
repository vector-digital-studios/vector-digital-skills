<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="Panel personal de comidas: calorías, macros y meta del día y de la semana.">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Mis comidas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="titulo">Mis comidas</h1>
      <nav class="tabs" role="tablist" aria-label="Vista">
        <button class="tab" role="tab" data-vista="dia" id="tabDia">Día</button>
        <button class="tab" role="tab" data-vista="semana" id="tabSemana">Semana</button>
      </nav>
    </div>
    <div class="fecha-nav">
      <button class="nav-btn" id="prev" aria-label="Anterior">‹</button>
      <div class="fecha-txt">
        <span id="fechaLabel">—</span>
        <input type="date" id="picker" aria-label="Elegir fecha">
      </div>
      <button class="nav-btn" id="next" aria-label="Siguiente">›</button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <div class="vacio">Cargando…</div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="app.js"></script>
</body>
</html>
