<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Sora; src: url('{{FUENTE}}'); font-weight: 100 800; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 675px; background: #111214; color: #f1f1f3; font-family: Sora, system-ui, sans-serif;
         padding: 64px 72px 110px; position: relative; overflow: hidden;
         display: flex; flex-direction: column; }
  .glow { position: absolute; right: -180px; top: -200px; width: 700px; height: 700px;
          background: radial-gradient(circle, color-mix(in srgb, {{ACENTO}} 22%, transparent), transparent 65%); }
  .k { color: {{ACENTO}}; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }
  h1 { font-size: 48px; line-height: 1.12; font-weight: 700; letter-spacing: -1px; margin: 18px 0 0; max-width: 1000px; }
  .ms { display: flex; gap: 22px; margin-top: auto; }
  .m { flex: 1; background: #1a1b1e; border: 1px solid #2c2d33; border-radius: 20px; padding: 26px 28px; }
  .v { font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .v small { font-size: 26px; font-weight: 600; color: {{ACENTO}}; margin-left: 8px; letter-spacing: 0; }
  .e { font-size: 22px; color: #b9bac2; margin-top: 12px; line-height: 1.3; }
  .pie { position: absolute; left: 72px; right: 72px; bottom: 46px; display: flex; justify-content: space-between;
         font-size: 19px; color: #9a9ba3; }
  .barra { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: {{ACENTO}}; }
</style></head>
<body><div class="glow"></div><div class="barra"></div>
  <div class="k">{{KICKER}}</div>
  <h1>{{TITULO}}</h1>
  <div class="ms">{{METRICAS}}</div>
  <div class="pie"><span>Origen: {{ORIGEN}}</span><span>{{FIRMA}}</span></div>
</body></html>
