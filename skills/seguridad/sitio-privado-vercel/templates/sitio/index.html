<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel privado</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <main class="marco">
    <p id="comprobando" class="nota">Comprobando sesión…</p>

    <section id="acceso" class="tarjeta" hidden>
      <svg class="candado" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1"/></svg>
      <h1>Panel privado</h1>
      <p class="nota">Escribe la contraseña para ver los datos.</p>
      <form id="formAcceso" autocomplete="on">
        <input type="text" name="username" autocomplete="username" value="panel" hidden>
        <label for="clave">Contraseña</label>
        <input id="clave" name="password" type="password" autocomplete="current-password" aria-describedby="error" required>
        <p id="error" class="error" role="alert" hidden></p>
        <label class="casilla"><input id="recordar" type="checkbox"> Recordarme 30 días en este equipo</label>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="panel" hidden>
      <header class="cabecera">
        <h1 id="titulo">Panel</h1>
        <button id="salir" type="button" class="secundario">Salir</button>
      </header>
      <p id="actualizado" class="nota"></p>
      <div id="cifras" class="cifras"></div>
      <h2>Últimas entradas</h2>
      <ul id="entradas" class="entradas"></ul>
    </section>
  </main>
</body>
</html>
